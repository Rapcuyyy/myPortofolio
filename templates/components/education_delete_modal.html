<p class="experience-status">
    <button type="button"
            class="button button-danger"
            popovertarget="delete-project-{{ education.id }}"
            aria-label="Hapus {{ education.place }}"
            title="Hapus Pendidikan">
        Hapus Pendidikan
    </button>
</p>
<div id="delete-project-{{ education.id }}"
     class="project-delete-modal"
     popover="auto"
     role="dialog"
     aria-modal="true"
     aria-labelledby="delete-project-title-{{ education.id }}">
    <button type="button"
            class="project-delete-modal__backdrop"
            popovertarget="delete-project-{{ education.id }}"
            popovertargetaction="hide"
            aria-label="Tutup konfirmasi hapus"></button>
    <div class="project-delete-modal__content">
        <button type="button"
                class="project-delete-modal__close"
                popovertarget="delete-project-{{ education.id }}"
                popovertargetaction="hide"
                aria-label="Tutup konfirmasi hapus">×</button>
        <h2 id="delete-project-title-{{ education.id }}">Hapus Pendidikan?</h2>
        <p>
            Apakah Anda yakin ingin menghapus
            <strong>{{ education.place }}</strong>?
        </p>
        <div class="project-delete-modal__actions">
            <button type="button"
                    class="button button-secondary"
                    popovertarget="delete-project-{{ education.id }}"
                    popovertargetaction="hide">Batal</button>
            <form method="post" action="{% url 'main:delete_education' education.id %}" style="display: flex; flex-direction: column; gap: 10px;">
                {% csrf_token %}
                
                <input type="password" name="secret_code" placeholder="Kode Rahasia" required class="project-search__input">
                
                <button type="submit" class="button button-danger">Ya, Hapus</button>
            </form>
        </div>
    </div>
</div>
